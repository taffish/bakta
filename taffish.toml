[package]
name = "bakta"
kind = "tool"
version = "1.12.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/bakta"

[command]
name = "taf-bakta"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/bakta:1.12.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["genome-annotation", "prokaryotic-genomics", "bacterial-genomics", "plasmid-annotation", "functional-annotation"]
keywords = ["bakta", "bacterial-genome-annotation", "prokaryotic-annotation", "plasmid", "mag", "gff3", "genbank", "amrfinder", "diamond", "trnascan-se", "aragorn", "infernal"]
description = "Bakta 1.12.0 runtime for rapid standardized bacterial, plasmid, and MAG annotation. Production Bakta databases are mandatory and user-provided via --db or BAKTA_DB."

[upstream]
name = "Bakta"
type = "github"
repo = "oschwengers/bakta"
homepage = "https://bakta.readthedocs.io/"
release_url = "https://github.com/oschwengers/bakta/releases/tag/v1.12.0"
downloads = "docker://oschwengers/bakta:v1.12.0@sha256:4cb7c3f8327483d661013b5bcbb33f0dc71119d661c4c887ec1dce6d81542c60; https://github.com/oschwengers/bakta/archive/refs/tags/v1.12.0.tar.gz"
version = "1.12.0"
license = "GPL-3.0"
citation = "Schwengers et al. 2021"
doi = "10.1099/mgen.0.000685"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["bakta", "bakta_db", "bakta_proteins", "bakta_plot", "bakta_io", "python3", "diamond", "blastn", "makeblastdb", "amrfinder", "tRNAscan-SE", "aragorn", "cmscan", "cmpress", "pilercr"]
test = ["bakta --version 2>&1 | grep -F 'bakta 1.12.0' >/dev/null && bakta --help 2>&1 | grep -F 'usage: bakta' >/dev/null && bakta_db --help 2>&1 | grep -F '{list,download,install,update}' >/dev/null && bakta_proteins --help 2>&1 | grep -F 'usage: bakta_proteins' >/dev/null && bakta_plot --help 2>&1 | grep -F 'usage: bakta_plot' >/dev/null && bakta_io --help 2>&1 | grep -F 'usage: bakta_io' >/dev/null", "python3 -c 'import bakta; print(bakta.__version__, bakta.__db_schema_version__)' | grep -Fx '1.12.0 6' >/dev/null && bakta_db list 2>&1 | grep -F 'Required database schema version: 6' >/dev/null && bakta_db list 2>&1 | grep -F '6.0' >/dev/null", "diamond version 2>&1 | grep -F 'diamond version 2.1.21' >/dev/null && blastn -version 2>&1 | grep -F 'blastn: 2.17.0' >/dev/null && makeblastdb -version 2>&1 | grep -F 'makeblastdb: 2.17.0' >/dev/null && amrfinder --version 2>&1 | grep -Fx '4.2.7' >/dev/null && tRNAscan-SE -h 2>&1 | grep -F 'tRNAscan-SE 2.0.12' >/dev/null && aragorn -h 2>&1 | grep -F 'ARAGORN v1.2.41' >/dev/null && cmscan -h 2>&1 | grep -F 'INFERNAL 1.1.5' >/dev/null && pilercr -h 2>&1 | grep -F 'pilercr v1.06' >/dev/null", "tmp=/tmp/taf-bakta-smoke-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; printf '>tiny\\nATGAAATAA\\n' > \"$tmp/tiny.fa\"; if bakta --db \"$tmp/no-db\" --output \"$tmp/out\" --prefix tiny \"$tmp/tiny.fa\" > \"$tmp/run.log\" 2>&1; then cat \"$tmp/run.log\" >&2; exit 1; fi; grep -Ei 'database|db' \"$tmp/run.log\" >/dev/null; test ! -e \"$tmp/out/tiny.gff3\"; rm -rf \"$tmp\""]
